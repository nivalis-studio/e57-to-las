[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/nivalis-studio/e57-to-las"
repository = "https://github.com/nivalis-studio/e57-to-las"
authors = ["pnodet <paul.nodet@gmail.com>", "pnwa <pnwa@icloud.com>"]
keywords = ["e57", "las", "laz", "lidar", "pointcloud"]
categories = ["science::geo", "command-line-utilities"]

[workspace.dependencies]
e57-to-las = { path = "crates/e57-to-las", version = "1.0.0-alpha.1", default-features = false }
e57 = "0.11.14"
las = "0.11.2"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = "1.23.0"
tempfile = "3.27.0"
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
ctrlc = "3.5.0"
indicatif = "0.18.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_types_passed_by_value = "warn"

# Optimize dependencies in tests: E57 decoding and LAZ compression are slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
