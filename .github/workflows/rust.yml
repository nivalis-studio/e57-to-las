name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Fetch test fixture
        run: git lfs pull --include "examples/bunnyDouble.e57"
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Library without the cli feature
        run: |
          cargo clippy --no-default-features --lib -- -D warnings
          if cargo tree --no-default-features -e normal --prefix none | grep -q '^clap '; then
            echo "clap must not be compiled into the library without default features" >&2
            exit 1
          fi
      - name: Run tests
        run: cargo test --verbose
